<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RGB Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;--surface3:#252830;
  --border:#2a2d35;--border2:#363a44;--text:#dde1ea;--muted:#6b7080;--dim:#3d4150;
  --accent:#f5a623;--accent-dim:rgba(245,166,35,0.12);--accent-glow:rgba(245,166,35,0.3);
  --green:#3ddc84;--red:#ff4757;--blue:#4dabf7;--purple:#cc5de8;
  --key-bg:#1a1c21;--key-border:#2e3038;--key-glow:rgba(255,255,255,0.06);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;display:flex;flex-direction:column}

.topbar{
  height:44px;background:#0a0b0d;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:0;flex-shrink:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:9px;margin-right:28px}
.logo-mark{width:24px;height:24px;position:relative;flex-shrink:0}
.logo-mark svg{width:100%;height:100%}
.logo-text{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.12em;color:#fff;text-transform:uppercase}
.logo-sub{font-size:9px;font-weight:400;color:var(--muted);letter-spacing:.18em;margin-left:2px;vertical-align:super}

.tabs{display:flex;height:44px}
.tab{
  padding:0 16px;height:44px;display:flex;align-items:center;gap:7px;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
  user-select:none;
}
.tab svg{width:13px;height:13px;opacity:.6}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab.active svg{opacity:1}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.conn-badge{
  display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:2px;
  background:var(--surface2);border:1px solid var(--border);
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:background .3s,box-shadow .3s}
.conn-dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.conn-dot.off{background:var(--red)}


.app{display:flex;flex:1;overflow:hidden}


.left-panel{
  width:56px;background:#0a0b0d;border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0;
}
.icon-btn{
  width:40px;height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);transition:background .12s,color .12s;
  border:1px solid transparent;
}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn.active{background:var(--surface3);color:var(--accent);border-color:var(--border)}
.icon-btn svg{width:18px;height:18px}
.icon-sep{width:28px;height:1px;background:var(--border);margin:4px 0}


.sidebar{
  width:210px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
}
.sidebar-head{
  padding:14px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.sidebar-title{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;
}
.sidebar-scroll{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-scroll::-webkit-scrollbar{width:3px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.section-label{
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  padding:8px 14px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 14px;
  cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;
  transition:background .1s,color .1s;border-left:2px solid transparent;
  user-select:none;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--surface2);color:var(--text);border-left-color:var(--accent)}
.nav-item svg{width:14px;height:14px;flex-shrink:0;opacity:.6}
.nav-item.active svg{opacity:1}

.device-entry{
  display:flex;align-items:center;gap:9px;padding:8px 14px;
  cursor:pointer;font-size:11px;color:var(--muted);
  transition:background .1s,color .1s;border-left:2px solid transparent;user-select:none;
}
.device-entry:hover{background:var(--surface2);color:var(--text)}
.device-entry.active{background:rgba(245,166,35,.08);color:var(--text);border-left-color:var(--accent)}
.device-led-count{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--dim);letter-spacing:.06em}


.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}


.device-bar{
  height:52px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;overflow-x:auto;
}
.device-bar::-webkit-scrollbar{height:2px}
.device-bar::-webkit-scrollbar-thumb{background:var(--border2)}
.device-chip{
  display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--surface2);border:1px solid var(--border);border-radius:3px;
  cursor:pointer;white-space:nowrap;transition:border-color .12s,background .12s;flex-shrink:0;
}
.device-chip:hover{border-color:var(--border2)}
.device-chip.active{border-color:var(--accent);background:rgba(245,166,35,.06)}
.device-chip-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.device-chip-icon svg{width:16px;height:16px}
.device-chip-name{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.device-chip-leds{font-size:10px;color:var(--muted)}
.device-chip.active .device-chip-name{color:var(--accent)}


.content-area{flex:1;display:flex;overflow:hidden}


.viz-area{
  flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;
  background:radial-gradient(ellipse at 50% 30%, #151820 0%, #0e0f11 70%);
}
.viz-toolbar{
  height:36px;background:rgba(22,24,28,.9);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;
  backdrop-filter:blur(8px);
}
.tool-group{display:flex;gap:2px;border-right:1px solid var(--border);padding-right:8px;margin-right:2px}
.tool-group:last-child{border-right:none;padding-right:0}
.vtool{
  height:26px;padding:0 9px;border-radius:3px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;transition:background .1s,color .1s;
  display:flex;align-items:center;gap:5px;
}
.vtool svg{width:12px;height:12px}
.vtool:hover{background:var(--surface2);color:var(--text)}
.vtool.active{background:rgba(245,166,35,.15);color:var(--accent)}
.vtool-sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.viz-hint{margin-left:auto;font-size:10px;color:var(--dim);font-style:italic;letter-spacing:.04em}

.viz-canvas{
  flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;
  padding:32px;position:relative;
}
.viz-canvas::-webkit-scrollbar{width:6px;height:6px}
.viz-canvas::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.kb-shell{
  background:linear-gradient(145deg,#1c1e24,#13141a);
  border-radius:10px;
  border:1px solid #000;
  padding:20px;
  position:relative;
  box-shadow:0 40px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.06);
  flex-shrink:0;
}
.kb-shell::before{
  content:'';position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(135deg,rgba(255,255,255,.03) 0%,transparent 50%);
  pointer-events:none;
}

.key{
  position:absolute;display:flex;align-items:center;justify-content:center;
  background:var(--key-bg);border:1px solid var(--key-border);border-radius:4px;
  cursor:pointer;transform:translate(-50%,-50%);
  transition:border-color .1s,transform .08s,box-shadow .1s;
  overflow:hidden;user-select:none;
  box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);
}
.key-label{
  font-family:'Barlow Condensed',sans-serif;font-size:7px;font-weight:500;
  color:rgba(255,255,255,.35);letter-spacing:.03em;text-align:center;
  line-height:1.1;pointer-events:none;
}
.key::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(255,255,255,.06) 0%,transparent 50%);
  pointer-events:none;
}
.key:hover{border-color:#444;z-index:10}
.key:hover .key-label{color:rgba(255,255,255,.6)}
.key.selected{
  border-color:rgba(255,255,255,.7) !important;
  box-shadow:0 0 12px rgba(245,166,35,.5),0 2px 4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);
  z-index:20;transform:translate(-50%,-52%);
}

#sel-box{
  position:fixed;border:1px solid var(--accent);
  background:rgba(245,166,35,.07);pointer-events:none;
  display:none;z-index:999;
}


.right-panel{
  width:240px;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
}
.rp-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.rp-tab{
  flex:1;height:36px;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;transition:color .12s,border-color .12s;
  user-select:none;
}
.rp-tab:hover{color:var(--text)}
.rp-tab.active{color:var(--text);border-bottom-color:var(--accent)}

.rp-body{flex:1;overflow-y:auto;padding:14px}
.rp-body::-webkit-scrollbar{width:3px}
.rp-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}


.color-wheel-wrap{position:relative;width:140px;height:140px;margin:0 auto 14px}
#color-wheel{width:140px;height:140px;border-radius:50%;cursor:crosshair;display:block;border:1px solid var(--border2)}
.wheel-cursor{
  width:10px;height:10px;border-radius:50%;border:2px solid #fff;
  position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.5);transition:left .05s,top .05s;
}

.brightness-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brightness-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.1em;color:var(--muted);width:12px;flex-shrink:0}
#brightness-slider{
  flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;outline:none;cursor:pointer;
  background:linear-gradient(to right,#000,#fff);
}
#brightness-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.brightness-val{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);width:24px;text-align:right}

.color-preview-strip{
  height:36px;border-radius:4px;margin-bottom:12px;
  border:1px solid var(--border2);position:relative;overflow:hidden;
  transition:background .1s;
}
.color-preview-strip::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 60%)}

.rgb-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.rgb-row{display:flex;align-items:center;gap:7px}
.rgb-ch{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;width:10px;color:var(--muted)}
.rgb-slider{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;cursor:pointer;outline:none}
.rgb-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
#rs{background:linear-gradient(to right,#111,#ff3333)}
#gs{background:linear-gradient(to right,#111,#33cc55)}
#bs{background:linear-gradient(to right,#111,#3366ff)}
.rgb-val{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);width:24px;text-align:right}

.hex-row{display:flex;align-items:center;gap:7px;margin-bottom:14px}
.hex-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.1em;color:var(--muted)}
.hex-input{
  flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:3px;
  padding:5px 8px;color:var(--text);font-family:'Barlow Condensed',sans-serif;
  font-size:11px;letter-spacing:.06em;outline:none;
  transition:border-color .12s;
}
.hex-input:focus{border-color:var(--accent)}

.divider{height:1px;background:var(--border);margin:12px 0}

.swatches-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.swatch-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:14px}
.sw{
  aspect-ratio:1;border-radius:3px;cursor:pointer;
  border:1px solid rgba(255,255,255,.06);
  transition:transform .1s,box-shadow .1s,border-color .1s;
}
.sw:hover{transform:scale(1.15);border-color:rgba(255,255,255,.25);box-shadow:0 2px 8px rgba(0,0,0,.4)}


.apply-all{
  width:100%;padding:9px;border:none;border-radius:3px;
  background:var(--accent);color:#000;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  transition:opacity .12s,background .12s;margin-bottom:7px;
}
.apply-all:hover{background:#e8941a}
.apply-all:active{opacity:.85}
.apply-sel{
  width:100%;padding:9px;border:1px solid var(--border2);border-radius:3px;
  background:var(--surface2);color:var(--text);
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.apply-sel:hover{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}


.fx-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fx-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:4px;
  padding:10px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:border-color .12s,background .12s;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.fx-card:hover{border-color:var(--border2);color:var(--text);background:var(--surface3)}
.fx-card.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.fx-card svg{width:20px;height:20px}
.fx-card[data-fx=rainbow]:hover,.fx-card[data-fx=rainbow].active{border-color:#cc5de8;color:#cc5de8;background:rgba(204,93,232,.08)}
.fx-card[data-fx=wave]:hover,.fx-card[data-fx=wave].active{border-color:var(--blue);color:var(--blue);background:rgba(77,171,247,.08)}
.fx-card[data-fx=pulse]:hover,.fx-card[data-fx=pulse].active{border-color:var(--red);color:var(--red);background:rgba(255,71,87,.08)}
.fx-card[data-fx=off]:hover,.fx-card[data-fx=off].active{border-color:var(--dim);color:var(--muted);background:transparent}

.speed-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.speed-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);width:36px}
#fx-speed{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:var(--border2);cursor:pointer;outline:none}
#fx-speed::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.5)}


.log-bar{
  height:28px;background:#0a0b0d;border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;overflow:hidden;
}
#log-line{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.04em;color:var(--muted);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.log-ok{color:var(--green)}
.log-err{color:var(--red)}
.log-info{color:var(--blue)}


.sel-count{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  background:rgba(245,166,35,.15);border:1px solid var(--accent);
  border-radius:2px;padding:3px 10px;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.1em;color:var(--accent);text-transform:uppercase;
  pointer-events:none;display:none;
}
</style>
</head>
<body>


<div class="topbar">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2L22 7.5V16.5L12 22L2 16.5V7.5L12 2Z" fill="#f5a623" opacity=".9"/>
        <path d="M12 6L18 9.5V15L12 18.5L6 15V9.5L12 6Z" fill="#0a0b0d"/>
        <path d="M12 9L15 10.75V13.25L12 15L9 13.25V10.75L12 9Z" fill="#f5a623" opacity=".5"/>
      </svg>
    </div>
    <div>
      <span class="logo-text">Studio<span class="logo-sub"> RGB</span></span>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="lighting">
      <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.22 3.22l1.41 1.41M11.37 11.37l1.41 1.41M3.22 12.78l1.41-1.41M11.37 4.63l1.41-1.41" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      Lighting
    </div>
    <div class="tab" data-tab="effects">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l1.5 4.5H14l-3.7 2.7 1.4 4.3L8 10 4.3 12.5l1.4-4.3L2 5.5h4.5z"/></svg>
      Effects
    </div>
  </div>
  <div class="topbar-right">
    <div class="conn-badge">
      <div class="conn-dot" id="conn-dot"></div>
      <span id="conn-txt">Connecting</span>
    </div>
  </div>
</div>


<div class="app">

  
  <div class="left-panel">
    <div class="icon-btn active" id="mode-select" title="Select">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l12 5-6 1-2 6z"/></svg>
    </div>
    <div class="icon-btn" id="mode-brush" title="Paint Brush">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3l3 3-9 9-4 1 1-4z"/><path d="M11 6l3 3"/></svg>
    </div>
    <div class="icon-btn" id="mode-fill" title="Fill All">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 17h14M6 13V7a6 6 0 0 1 8 0v6"/><circle cx="10" cy="13" r="2"/></svg>
    </div>
    <div class="icon-sep"></div>
    <div class="icon-btn" id="btn-clear-sel" title="Clear Selection">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="12" height="12" rx="2"/><path d="M8 8l4 4M12 8l-4 4"/></svg>
    </div>
    <div class="icon-btn" id="btn-sel-all" title="Select All">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg>
    </div>
    <div class="icon-sep"></div>
    <div class="icon-btn" id="btn-off" title="Turn Off">

<div id="sel-box"></div>

<script>

let R=245,G=166,B=35,brightness=100;
let mode='select';
let selectedDeviceId=null;
let currentLeds=[];
let selectedLeds=new Set();
let syncAll=false;
let activeEffect=null;
let devices=[];
let presets=[
  {name:'Studio Orange',r:245,g:166,b:35},
  {name:'Arctic White',r:255,g:255,b:255},
  {name:'Deep Blue',r:30,g:100,b:255},
  {name:'Neon Green',r:50,g:255,b:80},
  {name:'Crimson',r:220,g:30,b:50},
  {name:'Violet',r:160,g:40,b:255},
];

const KEY_MAP={
  1:'ESC',2:'F1',3:'F2',4:'F3',5:'F4',6:'F5',7:'F6',8:'F7',9:'F8',10:'F9',11:'F10',12:'F11',13:'F12',
  14:'~',15:'1',16:'2',17:'3',18:'4',19:'5',20:'6',21:'7',22:'8',23:'9',24:'0',25:'-',26:'=',27:'⌫',
  28:'⇥',29:'Q',30:'W',31:'E',32:'R',33:'T',34:'Y',35:'U',36:'I',37:'O',38:'P',39:'[',40:']',53:'\\',
  41:'⇪',42:'A',43:'S',44:'D',45:'F',46:'G',47:'H',48:'J',49:'K',50:'L',51:';',52:"'",54:'↵',
  55:'⇧',56:'\\',57:'Z',58:'X',59:'C',60:'V',61:'B',62:'N',63:'M',64:',',65:'.',66:'/',67:'⇧',
  68:'Ctrl',69:'⊞',70:'Alt',71:'',72:'Alt',73:'⊞',74:'☰',75:'Ctrl',129:'Fn'
};


const wc=document.getElementById('color-wheel');
const wctx=wc.getContext('2d');
let wheelDrag=false;

function drawWheel(){
  const cx=70,cy=70,r=68;
  for(let deg=0;deg<360;deg++){
    const a1=deg*Math.PI/180,a2=(deg+2)*Math.PI/180;
    const grad=wctx.createLinearGradient(cx,cy,cx+r*Math.cos(a1),cy+r*Math.sin(a1));
    grad.addColorStop(0,'#fff');
    grad.addColorStop(1,`hsl(${deg},100%,50%)`);
    wctx.beginPath();wctx.moveTo(cx,cy);
    wctx.arc(cx,cy,r,a1,a2);wctx.closePath();
    wctx.fillStyle=grad;wctx.fill();
  }
  
  const ring=wctx.createRadialGradient(cx,cy,r*0.7,cx,cy,r);
  ring.addColorStop(0,'transparent');ring.addColorStop(1,'rgba(0,0,0,0.2)');
  wctx.beginPath();wctx.arc(cx,cy,r,0,Math.PI*2);wctx.fillStyle=ring;wctx.fill();
}
drawWheel();

function pickWheel(e){
  const rect=wc.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const cx=70,cy=70,dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>70)return;
  const px=document.getElementById('wheel-cursor');
  px.style.left=x+'px';px.style.top=y+'px';
  const d=wctx.getImageData(Math.round(x),Math.round(y),1,1).data;
  const bri=brightness/100;
  setRGB(Math.round(d[0]*bri),Math.round(d[1]*bri),Math.round(d[2]*bri),false);
}
wc.onmousedown=e=>{wheelDrag=true;pickWheel(e)};
window.addEventListener('mousemove',e=>{if(wheelDrag)pickWheel(e)});
window.addEventListener('mouseup',()=>wheelDrag=false);


function setRGB(r,g,b,updateWheel=true){
  R=r;G=g;B=b;
  document.getElementById('rs').value=r;document.getElementById('rv').textContent=r;
  document.getElementById('gs').value=g;document.getElementById('gv').textContent=g;
  document.getElementById('bs').value=b;document.getElementById('bv').textContent=b;
  const hex=`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`.toUpperCase();
  document.getElementById('hex-in').value=hex;
  document.getElementById('color-preview').style.background=`rgb(${r},${g},${b})`;
}

['r','g','b'].forEach(c=>{
  document.getElementById(c+'s').addEventListener('input',e=>{
    window[c.toUpperCase()]=parseInt(e.target.value);
    document.getElementById(c+'v').textContent=e.target.value;
    setRGB(R,G,B);
  });
});

document.getElementById('brightness-slider').addEventListener('input',e=>{
  brightness=parseInt(e.target.value);
  document.getElementById('brightness-val').textContent=brightness;
  
  const scale=brightness/100;
  setRGB(Math.round(R*scale)||R,Math.round(G*scale)||G,Math.round(B*scale)||B);
});

document.getElementById('hex-in').addEventListener('change',e=>{
  const hex=e.target.value.replace('#','');
  if(hex.length===6){
    const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);
    setRGB(r,g,b);
  }
});

setRGB(245,166,35);


const SWATCHES=[
  {r:245,g:166,b:35},{r:255,g:255,b:255},{r:255,g:50,b:50},{r:50,g:220,b:80},
  {r:0,g:180,b:255},{r:180,g:0,b:255},{r:255,g:0,b:140},{r:0,g:255,b:200},
  {r:255,g:120,b:0},{r:80,g:130,b:255},{r:30,g:30,b:30},{r:0,g:0,b:0}
];
const swg=document.getElementById('sw-grid');
SWATCHES.forEach(s=>{
  const el=document.createElement('div');
  el.className='sw';
  el.style.background=`rgb(${s.r},${s.g},${s.b})`;
  el.onclick=()=>{setRGB(s.r,s.g,s.b);};
  swg.appendChild(el);
});


function renderPresets(){
  const list=document.getElementById('preset-list');
  list.innerHTML=presets.map((p,i)=>`
    <div onclick="loadPreset(${i})" style="display:flex;align-items:center;gap:8px;padding:7px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:border-color .1s" onmouseover="this.style.borderColor='var(--border2)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="width:18px;height:18px;border-radius:3px;background:rgb(${p.r},${p.g},${p.b});border:1px solid rgba(255,255,255,.1);flex-shrink:0"></div>
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text)">${p.name}</span>
      <button onclick="event.stopPropagation();deletePreset(${i})" style="margin-left:auto;background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px;padding:0 2px" title="Delete">✕</button>
    </div>
  `).join('');
}
function loadPreset(i){const p=presets[i];setRGB(p.r,p.g,p.b);}
function deletePreset(i){presets.splice(i,1);renderPresets();}
function savePreset(){
  const name=prompt('Preset name:','My Color');
  if(name){presets.push({name,r:R,g:G,b:B});renderPresets();}
}
renderPresets();


document.querySelectorAll('.rp-tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.rp-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.rp-body').forEach(x=>x.style.display='none');
    document.getElementById('rp-'+t.dataset.rp).style.display='';
  };
});


function setMode(m){
  mode=m;
  document.getElementById('mode-select').classList.toggle('active',m==='select');
  document.getElementById('mode-brush').classList.toggle('active',m==='brush');
  document.getElementById('mode-fill').classList.toggle('active',m==='fill');
  document.getElementById('vtool-select').classList.toggle('active',m==='select');
  document.getElementById('vtool-brush').classList.toggle('active',m==='brush');
  document.getElementById('vtool-fill').classList.toggle('active',m==='fill');
  if(m!=='select'){selectedLeds.clear();updateKeyStyles();}
}
document.getElementById('mode-select').onclick=()=>setMode('select');
document.getElementById('mode-brush').onclick=()=>setMode('brush');
document.getElementById('mode-fill').onclick=()=>setMode('fill');
document.getElementById('vtool-select').onclick=()=>setMode('select');
document.getElementById('vtool-brush').onclick=()=>setMode('brush');
document.getElementById('vtool-fill').onclick=()=>setMode('fill');


document.getElementById('nav-sync').onclick=()=>{
  syncAll=!syncAll;
  document.getElementById('sync-dot').style.background=syncAll?'var(--green)':'var(--dim)';
  log(syncAll?'info':'info',syncAll?'Sync all devices ON':'Sync all devices OFF');
};


function clearSel(){selectedLeds.clear();updateKeyStyles();}
function selectAll(){currentLeds.forEach(l=>selectedLeds.add(l.id));updateKeyStyles();}
document.getElementById('btn-clear-sel').onclick=clearSel;
document.getElementById('btn-sel-all').onclick=selectAll;
document.getElementById('btn-off').onclick=()=>applyEffect('off');

function updateKeyStyles(){
  document.querySelectorAll('.key').forEach(el=>{
    const id=parseInt(el.dataset.id);
    el.classList.toggle('selected',selectedLeds.has(id));
  });
  const cnt=selectedLeds.size;
  const badge=document.getElementById('sel-count-badge');
  const info=document.getElementById('sel-info');
  if(cnt>0){
    badge.textContent=`${cnt} key${cnt!==1?'s':''} selected`;
    badge.style.display='block';
    info.textContent=`${cnt} key${cnt!==1?'s':''} selected`;
  } else {
    badge.style.display='none';
    info.textContent=selectedDeviceId?`Click keys to select · Shift/Ctrl to multi-select`:'Click a device to begin';
  }
}


document.getElementById('btn-apply-all').onclick=()=>applyAllColor();
document.getElementById('btn-apply-sel').onclick=()=>applyToSelected();

async function applyAllColor(){
  activeEffect=null;document.querySelectorAll('.fx-card').forEach(c=>c.classList.remove('active'));
  if(syncAll){
    const r=await fetch('/api/color',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({r:R,g:G,b:B})});
    const d=await r.json();
    log(d.ok?'ok':'err',d.ok?`All devices → rgb(${R},${G},${B})`:`Failed: ${d.reason}`);
  } else if(selectedDeviceId){
    const r=await fetch(`/api/color/${encodeURIComponent(selectedDeviceId)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({r:R,g:G,b:B})});
    const d=await r.json();
    log(d.ok?'ok':'err',d.ok?`${selectedDeviceId.substring(0,8)}… → rgb(${R},${G},${B})`:`Failed: ${d.reason}`);
  }
}

async function applyToSelected(){
  if(!selectedDeviceId||selectedLeds.size===0){log('err','No keys selected');return;}
  const leds=Array.from(selectedLeds).map(id=>({id,r:R,g:G,b:B,a:255}));
  const res=await fetch(`/api/color/${encodeURIComponent(selectedDeviceId)}/leds`,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({leds})
  });
  const d=await res.json();
  log(d.ok?'ok':'err',d.ok?`${leds.length} keys → rgb(${R},${G},${B})`:`Failed: ${d.reason}`);
}


document.querySelectorAll('.fx-card').forEach(card=>{
  card.onclick=()=>{
    document.querySelectorAll('.fx-card').forEach(c=>c.classList.remove('active'));
    card.classList.add('active');
    activeEffect=card.dataset.fx;
  };
});

async function applyEffect(fx){
  const effect=fx||activeEffect;
  if(!effect)return;
  const body={effect};
  if(!syncAll&&selectedDeviceId)body.deviceId=selectedDeviceId;
  const r=await fetch('/api/effect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  log(d.ok?'ok':'err',d.ok?`Effect: ${effect}`:`Failed: ${d.reason}`);
}
document.querySelector('.apply-all[onclick="applyEffect()"]').onclick=()=>applyEffect();


async function selectDevice(id,model){
  selectedDeviceId=id;
  selectedLeds.clear();
  document.getElementById('vis-placeholder').style.display='none';
  document.getElementById('kb-mount').style.display='flex';
  document.getElementById('sel-info').textContent='Click keys to select · Shift/Ctrl for multi';
  log('info',`Viewing: ${model}`);

  
  document.querySelectorAll('.device-chip').forEach(c=>{
    c.classList.toggle('active',c.dataset.id===id);
  });
  document.querySelectorAll('.device-entry').forEach(c=>{
    c.classList.toggle('active',c.dataset.id===id);
  });

  const res=await fetch(`/api/devices/${encodeURIComponent(id)}/leds`);
  const data=await res.json();
  currentLeds=data.leds||[];
  renderKeyboard(currentLeds);
  startColorSync();
}


let lastKey=null;
function renderKeyboard(leds){
  const shell=document.getElementById('kb-shell');
  shell.innerHTML='';
  if(!leds.length){shell.innerHTML='<div style="color:var(--dim);font-size:11px;padding:20px">No LED position data</div>';return;}

  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  leds.forEach(l=>{mnX=Math.min(mnX,l.cx);mxX=Math.max(mxX,l.cx);mnY=Math.min(mnY,l.cy);mxY=Math.max(mxY,l.cy);});
  const W=mxX-mnX||1,H=mxY-mnY||1;
  const canvas=document.getElementById('viz-canvas');
  const avW=canvas.clientWidth-80,avH=canvas.clientHeight-80;
  const scale=Math.min(avW/W,avH/H,3);

  const keyW=Math.max(14,scale*8);
  const keyH=Math.max(14,scale*8);

  leds.forEach(l=>{
    const el=document.createElement('div');
    el.className='key';el.dataset.id=l.id;
    el.style.width=keyW+'px';el.style.height=keyH+'px';
    el.style.left=((l.cx-mnX)*scale+24)+'px';
    el.style.top=((l.cy-mnY)*scale+24)+'px';
    el.style.fontSize=Math.max(6,keyW*0.38)+'px';
    const lbl=KEY_MAP[l.id]||'';
    const span=document.createElement('span');
    span.className='key-label';span.textContent=lbl;
    el.appendChild(span);

    el.onmousedown=ev=>{
      ev.stopPropagation();
      if(mode==='brush'){
        paintKey(el,l);
      } else if(mode==='fill'){
        applyAllColor();
      } else {
        if(ev.shiftKey&&lastKey){
          
          const x1=Math.min(lastKey.cx,l.cx),x2=Math.max(lastKey.cx,l.cx);
          const y1=Math.min(lastKey.cy,l.cy),y2=Math.max(lastKey.cy,l.cy);
          currentLeds.forEach(k=>{if(k.cx>=x1&&k.cx<=x2&&k.cy>=y1&&k.cy<=y2)selectedLeds.add(k.id);});
        } else if(ev.ctrlKey||ev.metaKey){
          selectedLeds.has(l.id)?selectedLeds.delete(l.id):selectedLeds.add(l.id);
        } else {
          selectedLeds.clear();selectedLeds.add(l.id);
        }
        lastKey=l;
        updateKeyStyles();
      }
    };
    el.onmousemove=ev=>{
      if(mode==='brush'&&ev.buttons===1){paintKey(el,l);}
    };
    shell.appendChild(el);
  });

  shell.style.width=`${W*scale+48}px`;
  shell.style.height=`${H*scale+48}px`;
}

async function paintKey(el,led){
  el.style.backgroundColor=`rgb(${R},${G},${B})`;
  el.querySelector('.key-label').style.color=
    R+G+B>384?'rgba(0,0,0,0.7)':'rgba(255,255,255,0.5)';
  await fetch(`/api/color/${encodeURIComponent(selectedDeviceId)}/leds`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({leds:[{id:led.id,r:R,g:G,b:B,a:255}]})
  });
}


let syncInterval=null;
function startColorSync(){
  if(syncInterval)clearInterval(syncInterval);
  syncInterval=setInterval(async()=>{
    if(!selectedDeviceId||mode==='brush')return;
    try{
      const res=await fetch(`/api/devices/${encodeURIComponent(selectedDeviceId)}/colors`);
      const d=await res.json();
      if(d.ok&&d.colors){
        d.colors.forEach(c=>{
          const el=document.querySelector(`.key[data-id="${c.id}"]`);
          if(el&&!selectedLeds.has(c.id)){
            el.style.backgroundColor=`rgb(${c.r},${c.g},${c.b})`;
            el.querySelector('.key-label').style.color=
              c.r+c.g+c.b>384?'rgba(0,0,0,0.7)':'rgba(255,255,255,0.4)';
          }
        });
      }
    }catch(e){}
  },600);
}


let dragging=false,dragX0,dragY0;
const selBox=document.getElementById('sel-box');
const vizCanvas=document.getElementById('viz-canvas');

vizCanvas.addEventListener('mousedown',e=>{
  if(mode!=='select')return;
  const t=e.target;
  if(t.classList.contains('key')||t.classList.contains('key-label'))return;
  dragging=true;dragX0=e.clientX;dragY0=e.clientY;
  selBox.style.cssText=`display:block;left:${e.clientX}px;top:${e.clientY}px;width:0;height:0`;
  if(!e.ctrlKey&&!e.metaKey){selectedLeds.clear();updateKeyStyles();}
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const x=Math.min(dragX0,e.clientX),y=Math.min(dragY0,e.clientY);
  const w=Math.abs(e.clientX-dragX0),h=Math.abs(e.clientY-dragY0);
  selBox.style.left=x+'px';selBox.style.top=y+'px';
  selBox.style.width=w+'px';selBox.style.height=h+'px';
});
window.addEventListener('mouseup',e=>{
  if(!dragging)return;dragging=false;selBox.style.display='none';
  const x1=Math.min(dragX0,e.clientX),x2=Math.max(dragX0,e.clientX);
  const y1=Math.min(dragY0,e.clientY),y2=Math.max(dragY0,e.clientY);
  document.querySelectorAll('.key').forEach(el=>{
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    if(cx>=x1&&cx<=x2&&cy>=y1&&cy<=y2)selectedLeds.add(parseInt(el.dataset.id));
  });
  updateKeyStyles();
});


function log(type,msg){
  const el=document.getElementById('log-line');
  el.innerHTML=`<span class="log-${type}">${msg}</span>`;
}

async function pollStatus(){
  try{
    const d=await(await fetch('/api/status')).json();
    const dot=document.getElementById('conn-dot');
    const txt=document.getElementById('conn-txt');
    if(d.sdkReady){
      dot.className='conn-dot on';
      txt.textContent=`${d.devices.length} Device${d.devices.length!==1?'s':''}`;
      devices=d.devices;
      renderDeviceUI(d.devices);
    } else {
      dot.className='conn-dot off';
      txt.textContent='SDK Offline';
    }
  } catch(e){
    document.getElementById('conn-dot').className='conn-dot off';
    document.getElementById('conn-txt').textContent='Offline';
  }
  setTimeout(pollStatus,3000);
}

function renderDeviceUI(devs){
  
  const bar=document.getElementById('device-bar');
  if(!devs.length){bar.innerHTML='<div class="device-chip" style="opacity:.4;cursor:default"><div class="device-chip-name">No Devices</div></div>';return;}
  bar.innerHTML=devs.map(d=>`
    <div class="device-chip${selectedDeviceId===d.id?' active':''}" data-id="${d.id}" onclick="selectDevice('${d.id}','${d.model}')">
      <div class="device-chip-icon">
        <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="5" width="14" height="8" rx="1"/><path d="M4 5V3h8v2"/></svg>
      </div>
      <div>
        <div class="device-chip-name">${d.model}</div>
        <div class="device-chip-leds">${d.leds} LEDs</div>
      </div>
    </div>
  `).join('');

  
  document.getElementById('device-list-sidebar').innerHTML=devs.map(d=>`
    <div class="device-entry${selectedDeviceId===d.id?' active':''}" data-id="${d.id}" onclick="selectDevice('${d.id}','${d.model}')">
      <svg viewBox="0 0 12 12" fill="currentColor" style="width:11px;height:11px;flex-shrink:0"><rect x=".5" y="3" width="11" height="7" rx="1"/></svg>
      <span style="font-size:11px;font-weight:500">${d.model}</span>
      <span class="device-led-count">${d.leds}</span>
    </div>
  `).join('');

  
  if(!selectedDeviceId&&devs.length)selectDevice(devs[0].id,devs[0].model);
}

pollStatus();
</script>
</body>
</html>
